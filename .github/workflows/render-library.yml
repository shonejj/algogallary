name: Render static image library
# Manual: Actions → "Render static image library" → Run workflow. Re-renders lib/ and api/library.json and commits them.
on:
  workflow_dispatch:
    inputs:
      per_style:
        description: images per regular style
        default: '1'
      extra_rich:
        description: extra images for worlds, creatures and remixes
        default: '3'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/export-styles.mjs
      - run: |
          python3 -m http.server 8765 &
          sleep 2
          rm -rf lib
          node tools/render-library.cjs ${{ inputs.per_style }} ${{ inputs.extra_rich }}
      - run: |
          git config user.name "algogallery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib api/library.json api/styles.json
          git commit -m "Re-render static image library" || echo "nothing to commit"
          git push
